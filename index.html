  <script>
    // Captured as early as possible — 'beforeinstallprompt' can fire before
    // Flutter's engine has even finished downloading, and it must be
    // preventDefault()-ed synchronously to stash it for a later, deliberate
    // button tap instead of letting the browser show its own mini-infobar.
    // Only Chromium-based browsers (Chrome, Edge, Samsung Internet, Android
    // WebView) fire this at all — iOS Safari has no such API, so there's no
    // way to prompt an install there; users add to Home Screen manually via
    // the Share sheet.
    window.__aw139InstallPrompt = null;

    function aw139NotifyInstallable() {
      window.dispatchEvent(new CustomEvent('aw139-installable-changed', {
        detail: { canInstall: !!window.__aw139InstallPrompt }
      }));
    }

    window.addEventListener('beforeinstallprompt', function (event) {
      // Already running installed (e.g. relaunched from home screen) —
      // nothing to offer.
      if (window.matchMedia('(display-mode: standalone)').matches) return;
      event.preventDefault();
      window.__aw139InstallPrompt = event;
      aw139NotifyInstallable();
    });

    window.addEventListener('appinstalled', function () {
      window.__aw139InstallPrompt = null;
      aw139NotifyInstallable();
    });

    // Returns a Promise<bool> — true if the user accepted the install.
    // Resolves false immediately if there's no stashed prompt to use.
    window.aw139Install = function () {
      var promptEvent = window.__aw139InstallPrompt;
      if (!promptEvent) return Promise.resolve(false);
      window.__aw139InstallPrompt = null;
      aw139NotifyInstallable();
      return promptEvent.prompt()
        .then(function () { return promptEvent.userChoice; })
        .then(function (choice) { return choice.outcome === 'accepted'; })
        .catch(function () { return false; });
    };

    window.aw139CanInstall = function () {
      return !!window.__aw139InstallPrompt;
    };
  </script>

<body>
  <!-- Shown the instant the page loads, before Flutter's engine/bundle has
       even finished downloading — otherwise the user sees a blank white
       page with zero feedback for however long that takes. Removed on
       'flutter-first-frame', the event Flutter's web engine dispatches on
       window once it actually renders its first real frame. -->
  <style>
    /* A skeleton of the home screen, laid out as the home screen is (app
       bar with its title and version, the disclaimer, then the tool cards in
       a column for each section, or one below the other on a narrow screen)
       instead of a spinner: the page already has its shape while the engine
       downloads. */
    #app-loading {
      position: fixed;
      inset: 0;
      background: #f8f9fd;
      color: #1b1b1f;
      z-index: 9999;
      overflow: hidden;
      font-family: Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif;
      --sk-base: #e3e8ee;
      --sk-light: #f1f4f8;
    }
    @media (prefers-color-scheme: dark) {
      #app-loading { background: #121417; color: #e3e3e8; --sk-base: #23272d; --sk-light: #323840; }
    }
    #app-loading .bar {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      font-size: 20px;
      font-weight: 500;
    }
    #app-loading .ver {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.6;
      border: 1px solid currentColor;
      border-radius: 10px;
      padding: 0 7px;
      line-height: 16px;
    }
    #app-loading .page { padding: 16px; }
    #app-loading .banner { height: 38px; border-radius: 8px; margin-bottom: 12px; }
    #app-loading .cols {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0 16px;
    }
    @media (min-width: 1000px) {
      #app-loading .cols { grid-template-columns: repeat(3, 1fr); }
    }
    #app-loading .col { display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px; }
    #app-loading .sk {
      border-radius: 14px;
      background: linear-gradient(100deg, var(--sk-base) 30%, var(--sk-light) 50%, var(--sk-base) 70%);
      background-size: 300% 100%;
      animation: app-loading-sweep 1.4s linear infinite;
    }
    #app-loading .label { height: 14px; width: 120px; border-radius: 6px; margin: 6px 0 0; }
    #app-loading .card { height: 72px; }
    /* only the first cards of the long section on a narrow screen */
    @media (max-width: 999px) {
      #app-loading .card.more { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-loading .sk { animation: none; }
    }
    @keyframes app-loading-sweep {
      from { background-position: 100% 0; }
      to { background-position: 0 0; }
    }
  </style>

  <script>
    // (the build script puts the version of pubspec.yaml in; without it, as
    // when run from source, the label is left out)
    (function () {
      var v = document.getElementById('app-ver');
      if (v && v.textContent.indexOf('__') >= 0) v.remove();
    })();
  </script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) el.remove();
      // Only now let the service worker fetch the big per-tool assets for
      // offline use: a few seconds after the first screen, so they never
      // compete with the app's own download, and not at all on a data-saver
      // or very slow connection (those tools then load on first use).
      setTimeout(function () {
        var c = navigator.connection;
        if (c && (c.saveData || /(^|-)2g$/.test(c.effectiveType || ''))) return;
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.ready.then(function (reg) {
          if (reg.active) reg.active.postMessage('start-background');
        });
      }, 6000);
    });
  </script>
  <script>
    // Safety net: if the app has not drawn its first frame after 20 s, the
    // start failed (a bad or half-downloaded file, a stale cache). Clear the
    // service worker caches and reload once; the sessionStorage flag stops
    // this from looping.
    setTimeout(function () {
      if (!document.getElementById('app-loading')) return;
      try {
        if (sessionStorage.getItem('aw139-recovered')) return;
        sessionStorage.setItem('aw139-recovered', '1');
      } catch (e) { return; }
      var clear = window.caches
        ? caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          })
        : Promise.resolve();
      clear.catch(function () {}).then(function () { window.location.reload(); });
    }, 20000);
  </script>
  <script src="flutter_bootstrap.js?v=20261125111650" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      // sw.js serves everything cache-first, so once installed it never
      // checks the network for a newer version on its own — an installed
      // PWA in particular can go a long time without the browser's own
      // lazy ~24h update check ever firing. This makes the page actively
      // check for (and switch to) a new version instead of relying on
      // users to know they need to force-close and reopen the app.
      //
      // Was this page already being served by an earlier service worker
      // when it loaded? If so, a LATER controllerchange means a genuine
      // update just took over. If not (first-ever install, no previous
      // controller), the initial claim isn't an update to react to, so
      // this only ever reacts for RETURNING users.
      var hadController = !!navigator.serviceWorker.controller;
      var reloaded = false;
      // Reloading the INSTANT a new version takes over can land mid-use —
      // whatever's typed into a calculator isn't saved anywhere, so that's
      // a real, disruptive loss, not just a flicker. Deferred instead:
      // only reload once the page is hidden (the user switched away/
      // backgrounded it), so it happens invisibly and the app is already
      // fresh by the time they come back. If it's ALREADY hidden when the
      // update lands, nobody's looking either way, so that reloads right
      // away rather than waiting on a hide event that already happened.
      var updateReady = false;
      function reloadForUpdate() {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      }
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController) {
          hadController = true;
          return;
        }
        if (document.visibilityState === 'hidden') {
          reloadForUpdate();
        } else {
          updateReady = true;
        }
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // Force an immediate check for a new sw.js on the server rather
          // than waiting on the browser's own schedule — and again
          // whenever the app becomes visible, which covers reopening an
          // installed PWA from the home screen or app switcher.
          reg.update();
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') {
              reg.update();
            } else if (updateReady) {
              reloadForUpdate();
            }
          });
        }).catch(function () {
          // No sw.js: running from source (`flutter run`). The build writes
          // it (build.ps1, from tool/sw.template.js).
        });
      });
    }

    // Fix: Android Chrome reclaims the WebGL context when the PWA is backgrounded,
    // causing a black screen on return. Dispatching a resize event forces
    // Flutter/CanvasKit to re-acquire the context and redraw the canvas.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        window.dispatchEvent(new Event('resize'));
      }
    });
  </script>
