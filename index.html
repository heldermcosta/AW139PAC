<script>

<body>
  <!-- Shown the instant the page loads, before Flutter's engine/bundle has
       even finished downloading — otherwise the user sees a blank white
       page with zero feedback for however long that takes. Removed on
       'flutter-first-frame', the event Flutter's web engine dispatches on
       window once it actually renders its first real frame. -->
  <style>
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #ffffff;
      z-index: 9999;
    }
    #app-loading .spinner {
      width: 44px;
      height: 44px;
      border: 5px solid #dbe4ee;
      border-top-color: #1565c0;
      border-radius: 50%;
      animation: app-loading-spin 0.8s linear infinite;
    }
    #app-loading span {
      font-family: sans-serif;
      font-size: 14px;
      color: #5f6b7a;
    }
    @keyframes app-loading-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <div id="app-loading">
    <div class="spinner"></div>
    <span>Loading AW139 Tools…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }

    // Fix: Android Chrome reclaims the WebGL context when the PWA is backgrounded,
    // causing a black screen on return. Dispatching a resize event forces
    // Flutter/CanvasKit to re-acquire the context and redraw the canvas.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        window.dispatchEvent(new Event('resize'));
      }
    });
  </script>
</body>
